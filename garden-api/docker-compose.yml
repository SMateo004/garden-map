# Postgres local para probar cambios de lógica de base de datos sin tocar
# producción — ver CLAUDE.md "Staging local (Docker Postgres)". Puerto 5433
# (no el 5432 de siempre) para no chocar con una instalación local de
# Postgres que ya pudiera existir en la máquina.
#
# Uso:
#   docker compose up -d
#   npm run db:push:local     # sincroniza el schema en la base local (vacía)
#   npm run db:seed:local     # crea cuentas de prueba sintéticas (admin/cuidadores)
#   npm run dev:local         # arranca la API apuntando a esta base, no a producción
services:
  postgres-local:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: garden_local
      POSTGRES_PASSWORD: garden_local
      POSTGRES_DB: garden_local
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - '5433:5432'
    volumes:
      - garden_local_pgdata:/var/lib/postgresql/data

volumes:
  garden_local_pgdata:
