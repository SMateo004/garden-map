<!-- Unregister stale Flutter service workers + fallback route guard -->
<script>
(function () {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    });
  }
  // Fallback: si alguien llega directo a /login, /marketplace, etc. redirigir a Flutter
  var p = window.location.pathname;
  var flutterRoutes = ['/login', '/register', '/marketplace', '/become-caregiver', '/booking', '/profile', '/admin', '/track'];
  if (flutterRoutes.some(function(r){ return p === r || p.startsWith(r + '/'); })) {
    window.location.replace('/app.html#' + p + window.location.search);
  }
  // Hash-based Flutter routes: /#/mobile-verify, /#/verify → redirigir a app.html
  var h = window.location.hash;
  var flutterHashRoutes = ['/mobile-verify', '/verify'];
  if (h && flutterHashRoutes.some(function(r){ return h === '#' + r || h.startsWith('#' + r + '?') || h.startsWith('#' + r + '/'); })) {
    window.location.replace('/app.html' + h);
  }
})();
</script>

<style>
:root{
  --primary:#778C43; --primary-dark:#5C6E32; --primary-light:#8FA353;
  --accent:#58E262; --lime:#D9EF9F; --beige:#DBD0C4; --splash:#3D6B1A;
  --forest:#0D1A07; --forest-surf:#162610;
  --bg:#F5F2EC; --surface:#FFFFFF; --surface-elev:#F8FBF3;
  --text:#1E2D0F; --text-sec:#5C7238; --text-hint:#99AC75; --border:#DBD0C4;
  --warning:#FFB020;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--lime);color:var(--text);}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--beige);border-radius:5px;}

/* reveal on scroll */
.reveal{opacity:0;transform:translateY(36px);transition:opacity .7s cubic-bezier(.2,.7,.3,1),transform .7s cubic-bezier(.2,.7,.3,1);}
.reveal.in{opacity:1;transform:none;}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}

/* ── Identidad de servicios: cada icono tiene su gesto al pasar el mouse ── */
.svc-card{position:relative;overflow:hidden;}
.svc-card .svc-arrow{display:inline-block;transition:transform .25s cubic-bezier(.2,.7,.3,1);}
.svc-card:hover .svc-arrow{transform:translateX(6px);}
.svc-card .svc-band{position:absolute;inset:0 0 auto 0;height:5px;transform:scaleX(.18);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.3,1);}
.svc-card:hover .svc-band{transform:scaleX(1);}
.svc-card .svc-icon-box{transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
.svc-card:hover .svc-icon-box{transform:rotate(-6deg) scale(1.08);}
.svc-card:hover .pw{animation:pawstep .9s cubic-bezier(.2,.7,.3,1) both;}
.svc-card:hover .pw2{animation-delay:.15s;} .svc-card:hover .pw3{animation-delay:.3s;}
.svc-card:hover .sun-rays{animation:spin 6s linear infinite;}
.svc-card:hover .moon{animation:moonrise .8s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes pawstep{0%{opacity:.15;transform:translateY(4px)}100%{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes moonrise{0%{opacity:0;transform:translate(-4px,6px)}100%{opacity:1;transform:none}}
.svc-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:800;font-size:14px;transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s;}
.svc-chip:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(30,45,15,0.10);}

/* ── Hero: camino de huellas que se va marcando ── */
.hero-trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.trail-paw{opacity:0;animation:trailstep 5.4s ease-in-out infinite;}
@keyframes trailstep{0%{opacity:0}12%{opacity:1}55%{opacity:1}75%,100%{opacity:0}}
.hero-eyebrow{display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 10px;border-radius:999px;background:rgba(255,255,255,0.72);border:1px solid var(--border);backdrop-filter:blur(8px);font-weight:700;font-size:14.5px;color:var(--text-sec);animation:eyebrowin .7s .1s cubic-bezier(.2,.7,.3,1) both;}
@keyframes eyebrowin{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(88,226,98,.6);animation:livepulse 1.8s ease-out infinite;display:inline-block;flex-shrink:0;}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(88,226,98,.55)}100%{box-shadow:0 0 0 9px rgba(88,226,98,0)}}
.hl-underline{position:relative;white-space:nowrap;}
.hl-underline svg{position:absolute;left:-2%;bottom:-0.12em;width:104%;height:.32em;overflow:visible;}
.hl-underline path{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.1s .55s cubic-bezier(.2,.7,.3,1) forwards;}
@keyframes draw{to{stroke-dashoffset:0}}

/* ── Brote ── */
.brote-wave{animation:wave 2.6s ease-in-out infinite;}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(14deg)}80%{transform:rotate(-6deg)}90%{transform:rotate(10deg)}}
.brote-bob{animation:bob 4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ── Cómo funciona: la línea que une los pasos ── */
.how-grid{position:relative;}
.how-line{position:absolute;left:4%;right:4%;top:122px;height:2px;background:linear-gradient(90deg,transparent,rgba(88,226,98,.45),transparent);transform:scaleX(0);transform-origin:left;transition:transform 1.4s .3s cubic-bezier(.2,.7,.3,1);}
.reveal.in .how-line,.how-line.in{transform:scaleX(1);}
.how-card{transition:transform .3s cubic-bezier(.2,.7,.3,1),border-color .3s,background .3s;}
.how-card:hover{transform:translateY(-6px);border-color:rgba(88,226,98,.45) !important;background:#1B2F13 !important;}
.how-card:hover .how-ico{transform:scale(1.1) rotate(-6deg);}
.how-ico{transition:transform .35s cubic-bezier(.34,1.56,.64,1);}

/* ── Así se vive un paseo: teléfono ── */
.phone-stage{position:relative;display:flex;justify-content:center;padding:24px 0;}
.phone-glow{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(88,226,98,.28),rgba(217,239,159,.25) 45%,transparent 70%);}
.phone{position:relative;width:min(340px,100%);background:var(--surface);border-radius:40px;padding:10px;box-shadow:0 40px 80px rgba(30,45,15,.22),0 0 0 1px rgba(30,45,15,.06);transform:rotate(2deg);transition:transform .5s cubic-bezier(.2,.7,.3,1);}
.phone:hover{transform:rotate(0) translateY(-6px);}
.phone-notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:84px;height:22px;border-radius:999px;background:#0D1A07;z-index:2;}
.ph-hero{border-radius:32px 32px 22px 22px;padding:56px 22px 22px;color:#fff;}
.ph-avatar{position:relative;width:64px;height:64px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;}
.ph-ring{position:absolute;inset:-5px;border-radius:50%;border:2.5px solid rgba(255,255,255,.75);animation:ringpulse 2.4s ease-out infinite;}
@keyframes ringpulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.ph-badge{position:absolute;right:-6px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.15);}
.ph-title{font-weight:900;font-size:21px;letter-spacing:-.02em;line-height:1.15;margin-top:16px;}
.ph-caps{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.ph-cap{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12.5px;font-weight:800;}
.ph-body{padding:16px 10px 12px;}
.ph-map{height:96px;border-radius:18px;background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(119,140,67,.08) 22px 23px),repeating-linear-gradient(90deg,transparent 0 22px,rgba(119,140,67,.08) 22px 23px),#F4F8EC;overflow:hidden;}
.map-paw{animation:trailstep 4s ease-in-out infinite;opacity:0;}
.map-pulse{transform-origin:192px 12px;transform-box:view-box;animation:ringpulse 1.8s ease-out infinite;}
.ph-label{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-hint);margin:16px 6px 8px;font-family:'JetBrains Mono',monospace;}
.ph-note{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--surface-elev);border:1px solid #E8EFDA;margin-top:8px;opacity:0;animation:notein .6s cubic-bezier(.2,.7,.3,1) forwards;}
.reveal:not(.in) .ph-note{animation-play-state:paused;}
@keyframes notein{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.ph-note-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.ph-note-t{flex:1;font-weight:700;font-size:14px;color:var(--text);}
.ph-note-h{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-hint);}

/* ── Confianza: tarjetas con vida ── */
.stat-tile{transition:transform .35s cubic-bezier(.2,.7,.3,1),box-shadow .35s;}
.stat-tile:hover{box-shadow:0 22px 44px rgba(30,45,15,.16);}
.trust-point{transition:transform .25s;}
.trust-point:hover{transform:translateX(4px);}

/* ── Descarga ── */
.dl-brote{position:absolute;right:6%;bottom:-6px;}

@media (prefers-reduced-motion:reduce){
  .trail-paw,.map-paw,.ph-note{animation:none !important;opacity:1 !important;}
  .live-dot,.ph-ring,.map-pulse,.brote-wave,.brote-bob,.hero-eyebrow,.hl-underline path{animation:none !important;}
  .hl-underline path{stroke-dashoffset:0;}
  .svc-card:hover .pw,.svc-card:hover .sun-rays,.svc-card:hover .moon{animation:none;}
  .how-line{transform:scaleX(1);transition:none;}
  .phone{transform:none;}
}
</style>

// ─── SEARCH BAR (Airbnb-style segmented) ───────────────────
const DOG_SIZES = [
  { id:'p-s', label:'Perro pequeño', sub:'Hasta 10 kg', emoji:'🐕' },
  { id:'p-m', label:'Perro mediano', sub:'10–25 kg', emoji:'🐕' },
  { id:'p-l', label:'Perro grande', sub:'+25 kg', emoji:'🐕‍🦺' },
];

const SearchBar = ({ onSearch }) => {
  const [open, setOpen] = useState(null); // 'service'|'where'|'when'|'pet'|null
  const [service, setService] = useState(null);
  const [zone, setZone] = useState(null);
  const [when, setWhen] = useState(null);
  const [pet, setPet] = useState(null);
  const [petStep, setPetStep] = useState('species'); // 'species'|'size'
  const wrapRef = useRef(null);

  // Ciudades y zonas activas configuradas por el admin — nunca hardcodeadas.
  // Flujo de dos pasos dentro de "Dónde": primero ciudad, recién ahí zona.
  const [cities, setCities] = useState([]);
  const [citiesLoaded, setCitiesLoaded] = useState(false);
  const [cityId, setCityId] = useState(null);
  const [zonesByCity, setZonesByCity] = useState({}); // { [cityId]: zone[] }
  const [zonesLoading, setZonesLoading] = useState(false);
  const [whereStep, setWhereStep] = useState('city'); // 'city'|'zone'

  useEffect(() => {
    fetch(`${API_BASE}/cities`)
      .then(r => r.json())
      .then(d => { if (d.success) setCities(d.data); })
      .catch(() => {})
      .finally(() => setCitiesLoaded(true));
  }, []);

  const selectCity = (city) => {
    if (city.id !== cityId) setZone(null); // la zona anterior no aplica a otra ciudad
    setCityId(city.id);
    setWhereStep('zone');
    if (!zonesByCity[city.id]) {
      setZonesLoading(true);
      fetch(`${API_BASE}/cities/${city.id}/zones`)
        .then(r => r.json())
        .then(d => { if (d.success) setZonesByCity(prev => ({ ...prev, [city.id]: d.data })); })
        .catch(() => {})
        .finally(() => setZonesLoading(false));
    }
  };

  const selectedCity = cities.find(c => c.id === cityId) || null;
  const currentZones = zonesByCity[cityId] || [];
  const selectedZoneLabel = zone ? currentZones.find(z => z.key === zone)?.label : null;

  useEffect(()=>{
    const h = (e)=>{ if(wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(null); };
    document.addEventListener('mousedown', h);
    return ()=>document.removeEventListener('mousedown', h);
  },[]);

  const svcLabel = service ? SERVICES.find(s=>s.id===service).label : 'Elige un servicio';
  const canSearch = service || zone || when || pet;

  const Seg = ({ id, label, value, placeholder, first, onOpen }) => {
    const active = open === id;
    return (
      <button className="seg-btn" onClick={()=>{ if(!active && onOpen) onOpen(); setOpen(active?null:id); }} style={{
        flex:1, textAlign:'left', padding:'16px 24px', borderRadius:999,
        background: active ? 'var(--surface)' : 'transparent',
        boxShadow: active ? '0 10px 30px rgba(30,45,15,0.16)' : 'none',
        transition:'all .25s ease', position:'relative', minWidth:0,
      }}>
        <div className="mono" style={{ fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--text-hint)', fontWeight:600 }}>{label}</div>
        <div style={{ fontSize:16, fontWeight:value?800:600, color:value?'var(--text)':'var(--text-hint)', marginTop:3, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
          {value || placeholder}
        </div>
      </button>
    );
  };

  const Divider = () => <div style={{ width:1, height:34, background:'var(--border)', flexShrink:0, alignSelf:'center' }}/>;

  return (
    <div ref={wrapRef} style={{ position:'relative', width:'100%', maxWidth:940 }}>
      <div className="searchbar" style={{
        display:'flex', alignItems:'center', gap:4,
        background:'var(--surface)', borderRadius:999,
        border:'1px solid var(--border)',
        boxShadow:'0 18px 50px rgba(30,45,15,0.14)',
        padding:6,
      }}>
        <Seg id="service" label="Servicio" value={service?svcLabel:null} placeholder="Elige un servicio" first/>
        <Divider/>
        <Seg id="where" label="Dónde" value={selectedZoneLabel} placeholder={selectedCity ? `Zona en ${selectedCity.name}` : 'Ciudad y zona'}/>
        <Divider/>
        <Seg id="when" label="Cuándo" value={when} placeholder="Agrega una fecha"/>
        <Divider/>
        <Seg id="pet" label="Mascota" value={pet?PETS.find(p=>p.id===pet)?.label:null} placeholder="¿Quién va?" onOpen={()=>setPetStep('species')}/>
        <button className="search-btn" onClick={()=>onSearch({service,zone,when,pet})} style={{
          flexShrink:0, display:'flex', alignItems:'center', gap:10,
          background: canSearch ? 'var(--primary)' : 'var(--primary-light)',
          color:'var(--bg)', borderRadius:999, padding:'16px 26px', fontWeight:800, fontSize:16,
          transition:'all .25s ease', boxShadow:'0 8px 20px rgba(119,140,67,0.3)',
        }}>
          <IcoSearch size={20} stroke="var(--bg)"/>
          <span className="searchword">Buscar</span>
        </button>
      </div>

      {/* dropdown panels */}
      {open && (
        <div className="search-dropdown" style={{
          position:'absolute', top:'calc(100% + 14px)', left:0, right:0,
          background:'var(--surface)', borderRadius:28,
          border:'1px solid var(--border)', boxShadow:'0 24px 60px rgba(30,45,15,0.2)',
          padding:28, zIndex:20,
          animation:'pop .28s cubic-bezier(.2,.7,.3,1) both',
        }}>
          <style>{`@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}`}</style>

          {open==='service' && (
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
              {SERVICES.map(s=>{
                const on = service===s.id;
                return (
                  <button key={s.id} onClick={()=>{setService(s.id);setOpen('where');}} style={{
                    display:'flex', alignItems:'center', gap:12, padding:'14px 16px', borderRadius:16,
                    background: on?'var(--lime)':'var(--surface-elev)',
                    border:`1.5px solid ${on?'var(--primary)':'var(--border)'}`,
                    textAlign:'left', transition:'all .2s ease',
                  }}>
                    <div className="svc-opt-icon" style={{ width:40, height:40, borderRadius:12, background:on?'var(--surface)':'var(--lime)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                      <s.Icon size={20} stroke="var(--primary-dark)"/>
                    </div>
                    <div>
                      <div style={{ fontWeight:800, fontSize:15 }}>{s.label}</div>
                      <div style={{ fontSize:12.5, color:'var(--text-sec)' }}>{s.desc}</div>
                    </div>
                  </button>
                );
              })}
            </div>
          )}

          {open==='where' && (
            <div>
              {whereStep==='city' ? (
                <>
                  <div className="mono" style={{ fontSize:12, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--text-hint)', marginBottom:16, fontWeight:600 }}>¿En qué ciudad?</div>
                  {!citiesLoaded ? (
                    <div style={{ color:'var(--text-hint)', fontSize:14 }}>Cargando ciudades…</div>
                  ) : cities.length===0 ? (
                    <div style={{ color:'var(--text-hint)', fontSize:14 }}>Por ahora no hay ciudades activas.</div>
                  ) : (
                    <div style={{ display:'flex', flexWrap:'wrap', gap:10 }}>
                      {cities.map(c=>{
                        const on = cityId===c.id;
                        return <button key={c.id} onClick={()=>selectCity(c)} style={{
                          display:'flex', alignItems:'center', gap:8, padding:'12px 18px', borderRadius:999,
                          background:on?'var(--primary)':'var(--surface-elev)', color:on?'var(--bg)':'var(--text)',
                          border:`1.5px solid ${on?'var(--primary)':'var(--border)'}`, fontWeight:700, fontSize:15,
                          transition:'all .2s ease',
                        }}><IcoPin size={16} stroke={on?'var(--bg)':'var(--primary)'}/>{c.name}</button>;
                      })}
                    </div>
                  )}
                </>
              ) : (
                <>
                  <button onClick={()=>setWhereStep('city')} style={{
                    display:'flex', alignItems:'center', gap:6, marginBottom:12, padding:'4px 0',
                    background:'none', border:'none', color:'var(--text-sec)', fontSize:13,
                    fontWeight:600, cursor:'pointer',
                  }}>← Cambiar ciudad</button>
                  <div className="mono" style={{ fontSize:12, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--text-hint)', marginBottom:16, fontWeight:600 }}>Zonas de {selectedCity?.name || 'tu ciudad'}</div>
                  {zonesLoading ? (
                    <div style={{ color:'var(--text-hint)', fontSize:14 }}>Cargando zonas…</div>
                  ) : currentZones.length===0 ? (
                    <div style={{ color:'var(--text-hint)', fontSize:14 }}>Por ahora no hay zonas activas en esta ciudad.</div>

    const params = new URLSearchParams();

    if (query.when)    params.set('when', query.when);
    if (query.pet)     params.set('pet', query.pet);
    const qs = params.toString();
    return '/marketplace' + (qs ? '?' + qs : '');

const Reveal = ({ children, delay=0, style={} }) => {
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current;
    const o = new IntersectionObserver(([e])=>{ if(e.isIntersecting){ el.classList.add('in'); o.disconnect(); } }, { threshold:0.15 });
    o.observe(el); return ()=>o.disconnect();
  },[]);
  return <div ref={ref} className="reveal" style={{ transitionDelay:`${delay}s`, ...style }}>{children}</div>;
};

// ─── APP ───────────────────────────────────────────────────
function App() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(()=>{
    const h=()=>setScrolled(window.scrollY>30);
    window.addEventListener('scroll',h,{passive:true}); h();
    return ()=>window.removeEventListener('scroll',h);
  },[]);

  const handleSearch = (params) => {
    const p = {};
    // service: visita no existe en el API, omitir para mostrar todos
    if (params.service && params.service !== 'visita') p.service = params.service;
    // zone: clave uppercase para que Flutter la pre-seleccione en la UI
    if (params.zone) p.zone = params.zone;
    // mascota → petType + size (Flutter usa SMALL/MEDIUM/LARGE internamente)
    if (params.pet === 'gato') {
      p.petType = 'CATS';
    } else if (params.pet === 'p-s') {
      p.petType = 'DOGS'; p.size = 'SMALL';
    } else if (params.pet === 'p-m') {
      p.petType = 'DOGS'; p.size = 'MEDIUM';
    } else if (params.pet === 'p-l') {
      p.petType = 'DOGS'; p.size = 'LARGE';
    }
    window.location.href = flutterUrl('/marketplace', Object.keys(p).length ? p : null);
  };

  return (
    <div>
      <Nav scrolled={scrolled}/>
      <Hero onSearch={handleSearch}/>
      <Services/>
      <How/>
      <LiveShowcase/>
      <Trust/>
      <Download/>
      <Footer/>
      {/* Banner fijo en mobile para recomendar la app */}
      <div className="app-banner-mobile">
        <div style={{ display:'flex', alignItems:'center', gap:10, flex:1, minWidth:0 }}>
          <span style={{ flexShrink:0, width:40, height:40, borderRadius:12, background:'var(--lime)', display:'flex', alignItems:'center', justifyContent:'center' }}><PawLeaf size={28} color="var(--primary)"/></span>
          <div style={{ minWidth:0 }}>
            <div style={{ fontWeight:800, fontSize:13.5, color:'var(--text)', lineHeight:1.2 }}>Mejor experiencia en la app</div>
            <div style={{ fontSize:12, color:'var(--text-sec)', marginTop:2 }}>Reservas, GPS y notificaciones</div>
          </div>
        </div>
        <div style={{ display:'flex', gap:8, flexShrink:0 }}>
          <a href={APP_STORE_URL} style={{ background:'#000', color:'#fff', padding:'9px 14px', borderRadius:10, fontSize:12, fontWeight:700, whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:5 }}>
            <span style={{ fontSize:14 }}></span> iOS
          </a>
          <a href={PLAY_STORE_URL} style={{ background:'#000', color:'#fff', padding:'9px 14px', borderRadius:10, fontSize:12, fontWeight:700, whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:5 }}>
            <span style={{ fontSize:13 }}>▶</span> Android
          </a>
        </div>
      </div>
      <style>{`
        /* ── Tablet (≤860px) ─────────────────── */
        @media (max-width:860px){
          .navlinks a:not([href="#descargar"]):not(.nav-register):not(.nav-login){display:none;}
          .nav-login{display:none !important;}
          .searchbar{flex-direction:column;border-radius:28px;padding:10px;gap:2px;}
          .searchbar > div[style*="width: 1px"]{display:none;}
          .searchbar button{border-radius:18px !important;}
          .searchword{display:inline;}
          .trust-grid{grid-template-columns:1fr !important;gap:48px !important;}
          .live-grid{grid-template-columns:1fr !important;gap:40px !important;}
          .how-line{display:none;}
          .dl-brote{display:none;}
          .sec-pad{padding-top:80px !important;padding-bottom:80px !important;}
        }
        /* ── Mobile (≤620px) ─────────────────── */
        @media (max-width:620px){
          .nav-register{display:none !important;}
          .navlinks a[href="#descargar"]{display:none !important;}

          /* Searchbar: layout 2×2 horizontal en vez de columna */
          .searchbar{
            flex-direction:row !important;
            flex-wrap:wrap !important;
            border-radius:20px !important;
            padding:6px !important;
            gap:0 !important;
            align-items:stretch !important;
          }
          .searchbar .seg-btn{
            flex:none !important;
            width:50% !important;
            border-radius:14px !important;
            padding:12px 14px !important;
          }
          .searchbar .seg-btn .mono{ font-size:10px !important; }
          .searchbar .seg-btn > div:last-child{ font-size:14px !important; margin-top:2px !important; }
          .searchbar .search-btn{
            flex:none !important;
            width:100% !important;
            border-radius:14px !important;
            justify-content:center !important;
            padding:13px !important;
            margin-top:4px !important;
            font-size:15px !important;
          }
          /* Dropdown: más compacto, 1 columna en móvil */
          .search-dropdown{ padding:16px !important; border-radius:20px !important; }
          .search-dropdown > div{ grid-template-columns:1fr !important; gap:8px !important; }
          .svc-opt-icon{ width:32px !important; height:32px !important; border-radius:10px !important; }
          .pet-emoji{ font-size:20px !important; }
          .searchword{display:none;}

          /* Hero compacto: búsqueda visible sin hacer scroll */
          .hero-section{
            min-height:auto !important;
            padding:90px 5vw 32px !important;
          }
          .hero-h1{font-size:clamp(36px,10vw,52px) !important;}
          .hero-sub{font-size:16px !important;margin-top:16px !important;}
          .hero-trust{flex-direction:column;gap:10px;align-items:flex-start;margin-top:20px !important;}
          .hero-search-wrap{margin-top:28px !important;}
          .hero-eyebrow{font-size:12.5px;padding:6px 12px 6px 8px;}
          .hero-chips{margin-top:18px !important;}
          .hero-trail{opacity:.6;}
          .phone{transform:none;}

          /* Secciones: menos espacio vertical */
          .sec-pad{padding-top:60px !important;padding-bottom:60px !important;}

          /* Tarjetas de servicio: 1 columna */
          .svc-grid{grid-template-columns:1fr !important;}

          /* Sección download: espacio extra abajo para el banner fijo */
          .download-section{padding-bottom:110px !important;}

          /* Footer: extra bottom padding */
          .footer-inner{padding-bottom:100px !important;}

          /* Banner app fijo */
          .app-banner-mobile{display:flex !important;}
        }

        /* Banner app fijo — oculto en desktop */
        .app-banner-mobile{
          display:none;
          position:fixed;
          bottom:0;left:0;right:0;
          background:var(--surface);
          border-top:1px solid var(--border);
          padding:12px 16px 20px;
          align-items:center;
          gap:12px;
          z-index:100;
          box-shadow:0 -8px 32px rgba(30,45,15,0.12);
          padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
        }
      `}</style>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
